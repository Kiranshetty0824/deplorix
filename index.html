    <!-- Runtime fallback: if icon files fail to load, inject a generated "D" data URI -->
    <script>
      (function () {
        var FALLBACK =
          "data:image/svg+xml;utf8," +
          encodeURIComponent(
            '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">' +
              '<rect width="64" height="64" rx="12" fill="#fff"/>' +
              '<text x="50%" y="54%" text-anchor="middle" font-family="Arial,sans-serif" font-size="38" font-weight="900" fill="#000" letter-spacing="-2">DX</text>' +
            "</svg>"
          );
        function probe(href, ok, fail) {
          var img = new Image();
          img.onload = ok; img.onerror = fail; img.src = href;
        }
        function setIcon(href, type) {
          var links = document.querySelectorAll('link[rel~="icon"]');
          for (var i = 0; i < links.length; i++) links[i].parentNode.removeChild(links[i]);
          var l = document.createElement("link");
          l.rel = "icon"; if (type) l.type = type; l.href = href;
          document.head.appendChild(l);
        }
        probe("/favicon.svg", function () {}, function () {
          probe("/favicon-32x32.png",
            function () { setIcon("/favicon-32x32.png", "image/png"); },
            function () {
              probe("/favicon.ico",
                function () { setIcon("/favicon.ico"); },
                function () { setIcon(FALLBACK, "image/svg+xml"); }
              );
            }
          );
        });
      })();
    </script>
